<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok Live Photo Downloader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="ambient-glow bg-glow-1"></div>
    <div class="ambient-glow bg-glow-2"></div>

    <main class="app-viewport">
        <header class="top-nav">
            <div class="brand">
                <div class="live-dot"></div>
                <span class="brand-title">LIVE PHOTO</span>
            </div>
            <div class="platform-segment">
                <button type="button" class="segment-btn active" data-platform="ios">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.75 1.04-1.8 0.92-2.87-.9.04-1.99.6-2.64 1.36-.57.65-1.07 1.71-.93 2.74.99.08 2.02-.48 2.65-1.23z"/>
                    </svg>
                    <span>iOS</span>
                </button>
                <button type="button" class="segment-btn" data-platform="android">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                        <path d="M6 18c0 .55.45 1 1 1h1v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h2v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h1c.55 0 1-.45 1-1V8H6v10zM3.5 8C2.67 8 2 8.67 2 9.5v7c0 .83.67 1.5 1.5 1.5S5 17.33 5 16.5v-7C5 8.67 4.33 8 3.5 8zm17 0c-.83 0-1.5.67-1.5 1.5v7c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5zm-4.97-4.84l1.3-1.3c.2-.2.2-.51 0-.71-.2-.2-.51-.2-.71 0l-1.48 1.48C13.85 2.23 12.95 2 12 2c-.96 0-1.86.23-2.66.63L7.85 1.14c-.2-.2-.51-.2-.71 0-.2.2-.2.51 0 .71l1.31 1.31C6.97 4.26 6 6.01 6 8h12c0-1.99-.97-3.75-2.47-4.84zM10 5H9V4h1v1zm5 0h-1V4h1v1z"/>
                    </svg>
                    <span>Android</span>
                </button>
            </div>
        </header>

        <section class="search-bar-shell">
            <div class="search-input-box">
                <input type="text" id="urlInput" placeholder="Dán link TikTok vào đây..." autocomplete="off">
                <button type="button" id="pasteBtn" class="icon-action-btn" title="Dán">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </button>
                <button type="button" id="submitBtn" class="main-submit-btn">
                    <span class="btn-text">Tải</span>
                    <div class="btn-loader" style="display: none;"></div>
                </button>
            </div>
        </section>

        <section id="resultsSection" class="results-viewer-container" style="display: none;">
            <div class="post-creator-strip">
                <div class="creator-profile">
                    <img id="authorAvatar" class="creator-avatar" src="" alt="">
                    <div class="creator-meta">
                        <span id="authorNickname" class="creator-name">Nickname</span>
                        <span id="authorHandle" class="creator-tag">@username</span>
                    </div>
                </div>
                <div class="live-count-pill" id="filterNotice">0 Live Photo</div>
            </div>

            <div class="showcase-card">
                <div class="showcase-media-frame" id="showcaseFrame">
                    <img id="showcaseImage" class="active-image" src="" alt="">
                    <video id="showcaseVideo" class="active-video" loop muted playsinline preload="auto"></video>

                    <div class="slide-hud-top">
                        <div class="hud-counter" id="hudCounter">01 / 01</div>
                        <button type="button" id="hudCheckBtn" class="hud-check-btn active">
                            <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </button>
                    </div>

                    <div class="slide-hud-bottom">
                        <div class="live-status-badge">
                            <span class="pulse-ring"></span>
                            <span>LIVE</span>
                        </div>
                        <div class="live-play-hint" id="livePlayHint">Chạm để xem Live</div>
                    </div>

                    <button type="button" class="nav-arrow nav-prev" id="prevSlideBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="22" height="22">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <button type="button" class="nav-arrow nav-next" id="nextSlideBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="22" height="22">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>

                <div class="showcase-quick-action">
                    <button type="button" id="downloadCurrentBtn" class="quick-download-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="18" height="18">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        <span id="quickDownloadText">Tải ảnh này về</span>
                    </button>
                </div>
            </div>

            <div class="thumbnail-strip-shell">
                <div class="thumbnail-strip" id="thumbnailStrip"></div>
            </div>
        </section>

        <section id="emptyState" class="empty-view" style="display: none;">
            <div class="empty-view-icon">🔍</div>
            <h3 id="emptyTitle">Không có Live Photo</h3>
            <p id="emptyDesc">Liên kết này không chứa ảnh chuyển động nào.</p>
        </section>

        <aside id="stickyActionDock" class="sticky-action-dock" style="display: none;">
            <div class="dock-inner">
                <button type="button" id="selectAllToggleBtn" class="dock-select-toggle">
                    <div class="toggle-tick" id="dockSelectIcon">✔</div>
                    <span id="dockSelectedCount">Đã chọn 0 ảnh</span>
                </button>
                <div class="dock-buttons">
                    <button type="button" id="downloadZipBtn" class="dock-btn-zip" title="Tải tất cả dưới dạng ZIP">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                            <polyline points="21 8 21 21 3 21 3 8"></polyline>
                            <rect x="1" y="3" width="22" height="5"></rect>
                            <line x1="10" y1="12" x2="14" y2="12"></line>
                        </svg>
                        <span>ZIP</span>
                    </button>
                    <button type="button" id="downloadSelectedBtn" class="dock-btn-main">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="18" height="18">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        <span id="mainDownloadBtnText">Tải các ảnh đã chọn</span>
                    </button>
                </div>
            </div>
        </aside>
    </main>

    <div id="toast" class="toast"></div>

    <script src="/static/app.js"></script>
</body>
</html>
